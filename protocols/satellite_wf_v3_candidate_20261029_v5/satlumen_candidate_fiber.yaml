experiment:
  name: starrynet_v3_e_dataset_candidate_20261029_v5
  stage: validation_candidate
  seeds: [42]
dataset:
  data_dir: /home/shy/Project/SatLumen/npz_dataset
  train_file: train.npz
  val_file: valid.npz
  test_file: test.npz
  num_classes: 75
  require_cache: true
representation:
  kind: directional_count
  cache_schema: directional_count
  seq_len: 5000
  maximum_load_time: 120
  max_matrix_len: 2700
  log_transform: true
model:
  name: satlumen_conv_classifier
  count_dim: 256
  count_dilations: [1, 2, 4]
  temporal_dilations: [1, 2, 4, 1, 2, 4]
  dropout: 0.1
  pooling: masked_gated_mean_max
training:
  epochs: 100
  batch_size: 50
  lr: 0.001
  min_lr: 0.000001
  weight_decay: 0.05
  warmup_epochs: 5
  num_workers: 4
augmentation:
  mode: global_time_scale
  probability: 0.35
  min_scale: 0.85
loss:
  label_smoothing: 0.1
logging:
  log_dir: logs/directional_count/starrynet_v3_dataset_candidate_20261029_v5
  checkpoint_dir: checkpoints/directional_count/starrynet_v3_dataset_candidate_20261029_v5
